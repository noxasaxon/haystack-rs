[package]
name = "haystack-rust"
version = "0.1.0"
edition = "2021"
authors = ["Haystack Contributors"]
description = "Rust implementation of the Haystack framework"
repository = "https://github.com/deepset-ai/haystack"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
sha2 = "0.10"
lazy_static = "1.4"
regex = "1.10"
unicode-normalization = "0.1"
unicase = "2.7"
uuid = { version = "1.6", features = ["v4"] }
